name: CI Atual

on:
  push:
    branches: [main]

jobs:
  validate-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py central_data.py pipeline_sync.py conversores/*.py
      - name: Serialization smoke test
        run: |
          python - <<'PY'
          import gzip
          import io
          import pandas as pd
          import central_data

          frame = pd.DataFrame({"codigo": ["001", "002"], "saldo": [1.5, 2.0]})
          raw = central_data.dataframe_payload(frame)
          restored = pd.read_json(io.BytesIO(gzip.decompress(raw)), orient="table")
          assert len(restored) == 2
          assert list(restored.columns) == ["codigo", "saldo"]
          print("ok")
          PY

      - name: Signed upload bytes smoke test
        run: |
          python - <<'PY'
          from supabase import create_client
          import central_data

          client = create_client(
              central_data.supabase_url(),
              central_data.supabase_key(),
          )

          try:
              result = client.storage.from_("setta-data").upload_to_signed_url(
                  path="diagnostics/bytes-test.bin",
                  token="invalid-token-for-type-test",
                  file=b"setta-upload-type-test",
              )
              print("SIGNED_UPLOAD_BYTES_ACCEPTED", result)
          except TypeError as exc:
              raise AssertionError(
                  f"O cliente ainda rejeitou bytes: {exc}"
              ) from exc
          except Exception as exc:
              # Token inválido é esperado. O objetivo é confirmar que o corpo
              # em bytes passa pela camada de serialização sem TypeError.
              print("SIGNED_UPLOAD_REACHED_HTTP_LAYER", type(exc).__name__, str(exc)[:200])
          PY

      - name: Pipeline state smoke test
        run: |
          python - <<'PY'
          import central_data

          sources, derived = central_data.pipeline_state(
              ["relatorio_geral", "for001", "for022"],
              "relatorio_geral_tratado",
          )
          assert set(sources) == {"relatorio_geral", "for001", "for022"}, sources
          assert derived.get("base_key") == "relatorio_geral_tratado", derived
          print("pipeline-state-ok")
          PY

      - name: Startup sync architecture smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          pipeline = Path("pipeline_sync.py").read_text(encoding="utf-8")
          assert "def sync_all_pipelines(" in pipeline
          assert "def warm_all_current_frames(" in pipeline
          assert "ATUALIZANDO TODAS AS BASES DO CONVERSOR MRP" in app
          assert 'with st.spinner("Sincronizando com a Central de Dados...")' not in app
          assert "ÚLTIMA ATUALIZAÇÃO" in app
          print("startup-sync-ok")
          PY

      - name: SETTA Runtime Load Once smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          pipeline = Path("pipeline_sync.py").read_text(encoding="utf-8")
          package = Path("conversores/__init__.py").read_text(encoding="utf-8")

          assert 'href="?nav=' not in app
          assert "st.query_params" not in app
          assert "def set_nav_key(" in app
          assert 'st.session_state["_mrp_conversor_nav"]' in app
          assert "converter_general_status(_BOOT_RESULTS)" in app
          assert 'button[data-testid="stBaseButton-primary"]' in app
          assert 'button[data-testid="stBaseButton-secondary"]' in app
          assert ".st-key-setta_nav_0" in app
          assert "def ensure_all_bases_ready(" in app
          assert 'st.session_state.get("_mrp_converter_boot_done")' in app
          assert "def inspect_all_pipelines(" in pipeline
          assert "st.file_uploader =" not in package
          assert "st.selectbox =" not in package
          assert "st.caption =" not in package
          print("setta-runtime-load-once-ok")
          PY

      - name: Centralized source ingestion smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          central = Path("central_data.py").read_text(encoding="utf-8")
          pipeline = Path("pipeline_sync.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")

          assert "def build_normalized_source(" not in central
          assert "def _upload_normalized_source(" not in central
          assert "allow_legacy_excel: bool = False" in central
          assert "source_normalized_upload_prepare" not in central
          assert "def count_rows(" not in pipeline
          assert "pipelines.count_rows(" not in app
          assert "FONTE BRUTA ATUALIZADA" in app
          assert "aguardando normalização" in pipeline
          print("centralized-source-ingestion-ok")
          PY

      - name: SETTA Header Light Lock smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          central = Path("central_data.py").read_text(encoding="utf-8")
          config = Path(".streamlit/config.toml").read_text(encoding="utf-8")

          assert "DEFAULT_SETTA_UI_CONFIG" in app
          assert "SETTA UI — Header Superior V1" in app
          assert "SETTA UI — Top Actions V1" in app
          assert "SETTA UI — Chrome Clean V1" in app
          assert "SETTA UI — Light Lock V1" in app
          assert '"show_more": True' in app
          assert "TRAVAR A INTERFACE NO TEMA LIGHT" in app
          assert "SALVAR PADRÃO VISUAL" in app
          assert "ui_config" in central
          assert 'base = "light"' in config
          assert 'toolbarMode = "minimal"' in config
          assert 'backgroundColor = "#F4F7FB"' in config
          print("setta-header-light-lock-ok")
          PY


      - name: SETTA Drawer deterministic smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          assert "SETTA UI — Drawer Operacional V1" in app
          assert "SETTA UI — Top Controls V1" in app
          assert "def _setta_sidebar_is_open(" in app
          assert "def _setta_toggle_sidebar(" in app
          assert "def _setta_close_sidebar(" in app
          assert 'st.session_state["_setta_sidebar_open"] = False' in app
          assert "_setta_close_sidebar()" in app
          assert 'key="setta_drawer_toggle"' in app
          assert 'initial_sidebar_state="expanded"' in app
          assert "_setta_sidebar_close_stage" not in app
          assert 'st.link_button(' not in app
          assert "https://github.com/juniorsousa-oss/MRP-CONVERSOR" not in app
          assert '[data-testid="stHeader"]' in app
          assert '[data-testid="stToolbar"]' in app
          print("setta-drawer-deterministic-ok")
          PY

      - name: SETTA standard page layout smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          assert "SETTA UI — Layout padrão Streamlit" in app
          assert "SETTA UI — App Shell Rounded V1" not in app
          assert "height:calc(100vh - 36px)!important" not in app
          assert "border-radius:24px!important" not in app
          assert "box-shadow:0 24px 70px" not in app
          assert "width:100%!important" in app
          assert "min-height:100vh!important" in app
          assert "overflow-y:visible!important" in app
          assert 'with st.popover("⋮"' not in app
          print("setta-standard-page-layout-ok")
          PY

      - name: SETTA solid outer background smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          assert "radial-gradient(" not in app
          assert "background:#EEF3F8!important" in app
          print("setta-solid-outer-background-ok")
          PY
