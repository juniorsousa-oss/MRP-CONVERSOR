name: Corrigir favicon do conversor
on:
  push:
    paths:
      - '.github/workflows/fix-favicon.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir somente o favicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''favicon = Image.open("favicon.png.png")\n\nst.set_page_config(page_title="CONVERSOR | SETTA ", page_icon=favicon, layout="wide")'''
          new = '''FAVICON = Path(__file__).parent / "favicon.png.png"\n\nst.set_page_config(page_title="CONVERSOR | SETTA ", page_icon=str(FAVICON), layout="wide")'''
          if s.count(old) != 1:
              raise SystemExit('Trecho do favicon nao encontrado exatamente uma vez; nenhuma alteracao aplicada.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validar Python
        run: python -m py_compile app.py
      - name: Commitar e remover workflow temporario
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m 'Corrigir favicon do navegador no conversor'
          git rm .github/workflows/fix-favicon.yml
          git commit -m 'Remover workflow temporario do favicon'
          git push
