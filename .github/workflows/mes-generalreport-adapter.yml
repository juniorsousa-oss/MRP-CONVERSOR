name: Validar adaptador MES GeneralReport
on:
  push:
    branches: [main, feat/mes-generalreport-adapter-20261109, feat/mes-adaptador-com-quarentena-20261110]
    paths:
      - 'conversores/mes_generalreport.py'
      - 'tests/test_mes_generalreport.py'
      - '.github/workflows/mes-generalreport-adapter.yml'
  pull_request:
    branches: [main]
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install "pandas>=2.2,<3" "openpyxl>=3.1,<4"
      - name: Compilar adaptador e conversor
        run: python -m py_compile conversores/mes_generalreport.py conversores/relatorio_geral.py
      - name: Testar mapeamento e regras de demanda
        run: python -m unittest discover -s tests -p 'test_mes_generalreport.py' -v
