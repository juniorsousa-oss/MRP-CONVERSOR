name: SETTA Pipeline Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline_worker.py"
      - "pipeline_sync.py"
      - "central_data.py"
      - "conversores/**"
      - ".github/workflows/pipeline-worker.yml"

concurrency:
  group: setta-pipeline-worker
  cancel-in-progress: false

jobs:
  sync-derived-bases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize stale SETTA pipelines
        run: python pipeline_worker.py
