name: SETTA - Atualizar Bases Tratadas

on:
  schedule:
    # Verifica a Central SETTA a cada 5 minutos; só recalcula se houver mudança.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Evita duas publicações simultâneas pelo agendador ou botão manual.
concurrency:
  group: setta-pipelines-autonomos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      # Configuração opcional, somente NOSSA: nunca depende dos Secrets do ERP.
      SUPABASE_ANON_KEY: ${{ secrets.SETTA_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.SETTA_SUPABASE_URL }}
    steps:
      - name: Baixar código do Conversor MRP
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências dos conversores
        run: python -m pip install -r requirements.txt
      - name: Validar regras de semanas e executor
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Atualizar bases defasadas
        run: python scripts/sync_all_headless.py
